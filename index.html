<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Eastlake Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #991b1e;
      color: #111;
    }

    header {
      background: #f2f2f2;
      border-bottom: 4px solid #7f1619;
      padding: 40px 20px 28px;
      animation: fadeDown 0.6s ease;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
      color: #8c1d21;
      letter-spacing: 0.5px;
    }

    header p {
      margin-top: 10px;
      font-size: 15px;
      color: #444;
      max-width: 700px;
    }

    .motto {
      margin-top: 14px;
      font-weight: 600;
      color: #6e1417;
      font-size: 14px;
      letter-spacing: 0.4px;
    }

    main {
      max-width: 1200px;
      margin: 40px auto 60px;
      padding: 0 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 22px;
      animation: fadeUp 0.6s ease;
    }

    .card {
      background: #ffffff;
      border-radius: 8px;
      padding: 22px 16px;
      text-align: center;
      text-decoration: none;
      color: #222;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
    }

    .card span {
      display: block;
      font-size: 17px;
      font-weight: 600;
      color: #7a171a;
    }

    footer {
      background: #7f1619;
      color: #f0dede;
      text-align: center;
      padding: 22px 12px;
      font-size: 13px;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<header>
  <h1>Eastlake Games</h1>
  <p>Official School Games, Authorized For Student Use</p>
  <div class="motto">Wolf Strong Pack Strong</div>
</header>

<main>
  <div class="grid" id="games"></div>
</main>

<footer>
  Eastlake High School • Approved Digital Resources
</footer>

<script>
  const user = "counterofdays";
  const repo = "educatingtheworld";
  const path = "games";

  fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`)
    .then(res => res.json())
    .then(items => {
      const container = document.getElementById("games");

      items
        .filter(item => item.type === "dir")
        .sort((a, b) => a.name.localeCompare(b.name))
        .forEach(item => {
          const link = document.createElement("a");
          link.className = "card";
          link.href = `/educatingtheworld/games/${item.name}/`;

          const name = document.createElement("span");
          name.textContent = item.name.replace(/-/g, " ");

          link.appendChild(name);
          container.appendChild(link);
        });
    })
    .catch(err => {
      console.error("Failed to load games", err);
    });
</script>

</body>
</html>
