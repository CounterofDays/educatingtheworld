<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Eastlake Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Professional font stack -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* =======================
       DESIGN SYSTEM
    ======================= */
    :root {
      --red-primary: #8c1d21;
      --red-dark: #6f1417;
      --bg-main: #f6f7f8;
      --bg-card: #ffffff;
      --text-main: #1f2933;
      --text-muted: #6b7280;
      --border-light: #e5e7eb;
      --shadow-soft: 0 6px 18px rgba(0,0,0,0.08);
      --shadow-hover: 0 14px 32px rgba(0,0,0,0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
    }

    /* =======================
       UTILITY BAR
    ======================= */
    .utility-bar {
      background: #ffffff;
      border-bottom: 1px solid var(--border-light);
      padding: 6px 24px;
      display: flex;
      justify-content: flex-end;
      gap: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* =======================
       HEADER
    ======================= */
    header {
      background: linear-gradient(180deg, var(--red-primary), var(--red-dark));
      color: #ffffff;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 26px 24px 22px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 24px;
    }

    .branding h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .branding span {
      font-size: 13px;
      opacity: 0.9;
      letter-spacing: 0.4px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 26px;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      position: relative;
      padding-bottom: 4px;
    }

    nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 2px;
      background: #ffffff;
      transition: width 0.2s ease;
    }

    nav a:hover::after {
      width: 100%;
    }

    /* =======================
       SEARCH
    ======================= */
    .search-box {
      position: relative;
    }

    .search-box input {
      width: 190px;
      padding: 9px 36px 9px 14px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      outline: none;
      transition: width 0.25s ease, box-shadow 0.2s ease;
    }

    .search-box input:focus {
      width: 240px;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.25);
    }

    .search-box::after {
      content: "🔍";
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.6;
      font-size: 14px;
    }

    /* =======================
       HERO / SECTION HEADER
    ======================= */
    .hero {
      background: #ffffff;
      border-bottom: 1px solid var(--border-light);
      padding: 48px 24px;
    }

    .hero-inner {
      max-width: 1400px;
      margin: 0 auto;
    }

    .hero h2 {
      margin: 0;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .hero p {
      margin-top: 10px;
      font-size: 15px;
      color: var(--text-muted);
      max-width: 700px;
    }

    /* =======================
       MAIN CONTENT
    ======================= */
    main {
      max-width: 1400px;
      margin: 42px auto 80px;
      padding: 0 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 28px;
    }

    .card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 28px 22px;
      text-align: center;
      text-decoration: none;
      color: var(--text-main);
      box-shadow: var(--shadow-soft);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent, rgba(140,29,33,0.08), transparent);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .card:hover::before {
      opacity: 1;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-hover);
    }

    .card.hidden {
      display: none;
    }

    .card span {
      display: block;
      font-size: 19px;
      font-weight: 700;
      color: var(--red-primary);
    }

    /* =======================
       FOOTER
    ======================= */
    footer {
      background: var(--red-dark);
      color: #f3dede;
      text-align: center;
      padding: 26px 18px;
      font-size: 13px;
    }

    /* =======================
       RESPONSIVE
    ======================= */
    @media (max-width: 900px) {
      .header-inner {
        grid-template-columns: 1fr;
        text-align: center;
      }

      nav {
        flex-wrap: wrap;
      }

      .search-box {
        margin-top: 10px;
      }
    }
  </style>
</head>

<body>

<div class="utility-bar">
  <span>Translate</span>
  <span>Help</span>
</div>

<header>
  <div class="header-inner">
    <div class="branding">
      <h1>Eastlake Games</h1>
      <span>Eastlake High School</span>
    </div>

    <nav>
      <a href="#">About</a>
      <a href="#">Academics</a>
      <a href="#">Activities</a>
      <a href="#">Athletics</a>
      <a href="#">Students</a>
    </nav>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search games">
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <h2>Games Directory</h2>
    <p>Approved educational and recreational games curated for Eastlake students.</p>
  </div>
</section>

<main>
  <div class="grid" id="games"></div>
</main>

<footer>
  Eastlake High School • Approved Digital Student Resources
</footer>

<script>
  const user = "counterofdays";
  const repo = "educatingtheworld";
  const path = "games";

  // ✏️ MANUAL GAMES
 const manualGames = [
    { name: "SandBoxels", url: "https://hydrophobis.github.io/sandboxels/" },
    { name: "Bit Planes", url: "https://counterofdays.github.io/another-game-repository/bit-planes/" },
    { name: "Super Hot", url: "https://counterofdays.github.io/another-game-repository/superhot/" }
  ];

  const container = document.getElementById("games");
  const searchInput = document.getElementById("searchInput");
  let cards = [];

  function createCard(name, url) {
    const card = document.createElement("a");
    card.className = "card";
    card.href = url;
    card.dataset.name = name.toLowerCase();

    const span = document.createElement("span");
    span.textContent = name;

    card.appendChild(span);
    container.appendChild(card);
    cards.push(card);
  }

  // Manual games first
  manualGames.forEach(game => createCard(game.name, game.url));

  // GitHub games
  fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`)
    .then(res => res.json())
    .then(items => {
      items
        .filter(item => item.type === "dir")
        .sort((a, b) => a.name.localeCompare(b.name))
        .forEach(item => {
          createCard(
            item.name.replace(/-/g, " "),
            `/educatingtheworld/games/${item.name}/`
          );
        });
    });

  // Live search
  searchInput.addEventListener("input", () => {
    const query = searchInput.value.toLowerCase();
    cards.forEach(card => {
      card.classList.toggle("hidden", !card.dataset.name.includes(query));
    });
  });
</script>

</body>
</html>
