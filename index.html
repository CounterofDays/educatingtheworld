<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Eastlake Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #0b0f14, #0f1720);
      color: #e6e6e6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    header {
      text-align: center;
      padding: 60px 20px 30px;
    }

    header h1 {
      font-size: 42px;
      margin: 0;
      letter-spacing: 1px;
    }

    header p {
      margin-top: 12px;
      font-size: 16px;
      color: #aab4c3;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .card {
      background: #151c27;
      border-radius: 14px;
      padding: 22px 16px;
      text-align: center;
      text-decoration: none;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5);
      background: #1b2534;
    }

    .card span {
      display: block;
      font-size: 18px;
      margin-top: 8px;
    }

    footer {
      text-align: center;
      padding: 30px 10px;
      font-size: 13px;
      color: #6f7a8a;
    }
  </style>
</head>

<body>

<header>
  <h1>Eastlake Games</h1>
  <p>Official School Games, Authorized For Student Use</p>
</header>

<main>
  <div class="grid" id="games"></div>
</main>

<footer>
  © Eastlake • HTML5 Game Archive
</footer>

<script>
  const user = "counterofdays";
  const repo = "educatingtheworld";
  const path = "games";

  fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`)
    .then(res => res.json())
    .then(items => {
      const container = document.getElementById("games");

      items
        .filter(item => item.type === "dir")
        .sort((a, b) => a.name.localeCompare(b.name))
        .forEach(item => {
          const link = document.createElement("a");
          link.className = "card";
          link.href = `/educatingtheworld/games/${item.name}/`;

          const name = document.createElement("span");
          name.textContent = item.name.replace(/-/g, " ");

          link.appendChild(name);
          container.appendChild(link);
        });
    })
    .catch(err => {
      console.error("Failed to load games", err);
    });
</script>

</body>
</html>
